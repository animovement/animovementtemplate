template:
  light-switch: true
  bslib:
    # Both SIL Open Font License, fetched at build time and written into the
    # site's deps/, so pages make no request to Google.
    base_font: {google: "Source Sans Pro"}
    code_font: {google: "Source Code Pro"}
    # Bootstrap derives its heading scale from this, so h1 lands at 3rem.
    # 1.2rem reads heavy in Bootstrap's system sans but sits right in Source
    # Sans Pro, which is the pairing the tidymodels sites use.
    font_size_base: 1.2rem
    # Twice Bootstrap's default. Half of it becomes the container's horizontal
    # padding, so the content block starts further in; the same variable is the
    # column gutter, which also opens up the gap to the sidebar.
    grid_gutter_width: 3rem

home:
  links:
    # The hub, not the metapackage's own site: this is the one route to the
    # tutorials from every package site, and on the metapackage site itself
    # the old target was the page the reader was already on.
    - text: Learn more about animovement
      href: https://animovement.dev

# Shared author details, picked up by each package's pkgdown site.
authors:
  Mikkel Roald-Arbøl:
    href: https://roald-arboel.com

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, animovement, zulip, github, lightswitch]
  components:
    # Reference always exists; News is custom-labelled (replaces the default
    # "Changelog"). Articles is left as the pkgdown built-in so it auto-hides
    # for packages without vignettes (a custom component with an explicit href
    # would render unconditionally and 404).
    #
    # Items that carry text carry no icon: the icons cost width in a bar that
    # already wraps on animovement, and text plus icon on some items and not
    # others reads as inconsistent. Zulip, GitHub and the light switch stay
    # icon-only, labelled by aria-label.
    reference:
      text: Reference
      href: reference/index.html
      aria-label: Reference
    news:
      text: News
      href: news/index.html
      aria-label: News
    animovement:
      text: animovement
      aria-label: animovement
      menu:
        - text: anicheck
          href: https://animovement.dev/anicheck/
        - text: anicore
          href: https://animovement.dev/anicore/
        - text: animetric
          href: https://animovement.dev/animetric/
        - text: animovement
          href: https://animovement.dev/animovement/
        - text: aniprocess
          href: https://animovement.dev/aniprocess/
        - text: aniread
          href: https://animovement.dev/aniread/
        - text: anispace
          href: https://animovement.dev/anispace/
        - text: anivis
          href: https://animovement.dev/anivis/
    zulip:
      icon: fa-comments
      href: https://animovement.zulipchat.com
      aria-label: Chat on Zulip
